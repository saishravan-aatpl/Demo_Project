# Free Supabase projects pause after about a week without activity.
# This runs every 3 days on GitHub's servers and makes one tiny database call
# (the keepalive() function from supabase/setup.sql) so the project stays awake.
# It reads no user data. You can also run it by hand: Actions tab > this workflow > Run workflow.

name: Keep Supabase awake

on:
  schedule:
    - cron: '23 4 */3 * *'   # 04:23 UTC every 3rd day
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Call the keepalive function
        run: |
          read -r URL KEY < <(node -e "
            global.window = {};
            require('./config.js');
            const c = window.DASHBOARD_CONFIG || {};
            console.log((c.supabaseUrl || '-') + ' ' + (c.supabaseKey || '-'));
          ")
          if [ "$URL" = "-" ] || [ "$KEY" = "-" ]; then
            echo "Sync is not configured in config.js yet - nothing to keep awake."
            exit 0
          fi
          curl --fail --silent --show-error -X POST "$URL/rest/v1/rpc/keepalive" \
            -H "apikey: $KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
          echo
          echo "Supabase is awake."
